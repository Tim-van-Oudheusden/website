services:
  front-end:
    build:
      context: .
      dockerfile: front-end/Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./front-end:/app/front-end
      - ./shared:/app/shared
      - /app/node_modules
      - /app/front-end/node_modules
    environment:
      - NODE_ENV=development

  back-end:
    build:
      context: .
      dockerfile: back-end/Dockerfile
      target: dev
    ports:
      - "3001:3001"
    volumes:
      - ./back-end:/app/back-end
      - ./shared:/app/shared
      - /app/node_modules
      - /app/back-end/node_modules
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
