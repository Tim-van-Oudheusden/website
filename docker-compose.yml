services:
  front-end:
    build:
      context: .
      dockerfile: front-end/Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./front-end:/app/front-end
      - ./shared:/app/shared
      - ./package.json:/app/package.json:ro
      - ./bun.lock:/app/bun.lock
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Override the proxy target so Vite forwards API requests to the
      # back-end Docker service instead of localhost (which would be
      # this container's own loopback and cause ECONNREFUSED).
      - VITE_BACKEND_HOST=back-end
    depends_on:
      back-end:
        condition: service_healthy

  back-end:
    build:
      context: .
      dockerfile: back-end/Dockerfile
      target: dev
    ports:
      - "3001:3001"
    volumes:
      - ./back-end:/app/back-end
      - ./shared:/app/shared
      - ./package.json:/app/package.json:ro
      - ./bun.lock:/app/bun.lock
      - /app/node_modules
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
