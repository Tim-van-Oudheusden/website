  <text x="50" y="616" font-size="11" fill="#77767B">tasks completed per hour by contributor agents connected to this hive</text>

  <!-- Runs by backend -->
  <rect x="650" y="476" width="320" height="150" rx="12" fill="#FFF"/>
  <text x="670" y="504" font-size="16" font-weight="700" fill="#000">Runs by backend, last 7 days</text>
  <text x="670" y="532" font-size="13" font-weight="600" fill="#000">omp · 75 runs</text>
  <g>
    <rect x="670" y="542" width="231.5" height="18" fill="#66800B"/>
    <rect x="901.5" y="542" width="33.6" height="18" fill="#AF3029"/>
    <rect x="935.1" y="542" width="14.9" height="18" fill="#B7B5AC"/>
  </g>
  <g font-size="12" fill="#5E5C64">
    <text x="670" y="580">62 completed · 9 failed · 4 abandoned</text>
    <text x="670" y="598">run time p50 6 min · p95 21 min</text>
    <text x="670" y="616" font-size="11" fill="#77767B">percentiles per backend, never combined</text>
  </g>

  <text x="30" y="660" font-size="12" fill="#5E5C64">Hive is an open-source agent orchestrator (github.com/hivecommons/hive). How it works on this repo: docs/multi-agent.md.</text>
  <text x="30" y="678" font-size="12" fill="#5E5C64">Repository names, agent names, cost and logs are deliberately not published. Each chart has a "Show data" table below it.</text>
</svg>
