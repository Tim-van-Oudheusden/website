<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title>Agentic tab: live Hive metrics section, desktop wireframe in the light theme</title>
  <desc>Header with live status pill, four KPI tiles from Hive's widget summary, queue lines and governor mode band, contributor tasks per hour, runs by backend, and this repo's pull requests from public GitHub data. All numbers are illustrative.</desc>
  <rect width="1000" height="940" fill="#F3EFE5"/>
  <text x="30" y="22" font-size="11" letter-spacing="1" fill="#77767B">WIREFRAME · LIGHT THEME · ILLUSTRATIVE NUMBERS</text>

  <!-- Header -->
  <text x="30" y="60" font-size="28" font-weight="700" fill="#000">The hive, live</text>
  <text x="30" y="86" font-size="14" fill="#5E5C64">Hive files, claims and lands work in this repo. These numbers come from the instance running on this server.</text>
  <rect x="770" y="40" width="200" height="30" rx="15" fill="#FFF" stroke="#DEDDDA"/>
  <circle cx="789" cy="55" r="5" fill="#66800B"/>
  <text x="802" y="60" font-size="13" fill="#241F31">Live · updated 40 s ago</text>

  <!-- KPI tiles: latest widget history point -->
  <g font-size="13" fill="#5E5C64">
    <rect x="30" y="110" width="220" height="96" rx="12" fill="#FFF"/>
    <text x="50" y="136">Agents running</text>
    <text x="50" y="174" font-size="30" font-weight="700" fill="#000">5 / 7</text>
    <text x="50" y="194" font-size="12">of the agents configured</text>

    <rect x="270" y="110" width="220" height="96" rx="12" fill="#FFF"/>
    <text x="290" y="136">Open work</text>
    <text x="290" y="174" font-size="30" font-weight="700" fill="#000">23</text>
    <text x="290" y="194" font-size="12">14 issues · 9 PRs · 4 held</text>

    <rect x="510" y="110" width="220" height="96" rx="12" fill="#FFF"/>
    <text x="530" y="136">Ready to merge</text>
    <text x="530" y="174" font-size="30" font-weight="700" fill="#000">6</text>
    <text x="530" y="194" font-size="12">11 actionable</text>

    <rect x="750" y="110" width="220" height="96" rx="12" fill="#FFF"/>
    <text x="770" y="136">Governor mode</text>
    <text x="770" y="174" font-size="30" font-weight="700" fill="#000">busy</text>
    <text x="770" y="194" font-size="12">how hard Hive works the queue</text>
  </g>

