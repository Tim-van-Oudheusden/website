<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title>Agentic tab: live Hive metrics section, desktop wireframe in the light theme</title>
  <desc>Header with live status pill, four KPI tiles from Hive's widget summary, queue lines and governor mode band, contributor tasks per hour and runs by backend. All numbers are illustrative.</desc>
  <rect width="1000" height="690" fill="#F3EFE5"/>
  <text x="30" y="22" font-size="11" letter-spacing="1" fill="#77767B">WIREFRAME · LIGHT THEME · ILLUSTRATIVE NUMBERS</text>

  <!-- Header -->
  <text x="30" y="60" font-size="28" font-weight="700" fill="#000">The hive, live</text>
  <text x="30" y="86" font-size="14" fill="#5E5C64">Hive files, claims and lands work in this repo. These numbers come from the instance running on this server.</text>
  <rect x="770" y="40" width="200" height="30" rx="15" fill="#FFF" stroke="#DEDDDA"/>
  <circle cx="789" cy="55" r="5" fill="#66800B"/>
  <text x="802" y="60" font-size="13" fill="#241F31">Live · updated 40 s ago</text>

  <!-- KPI tiles: latest widget history point -->
  <g font-size="13" fill="#5E5C64">
    <rect x="30" y="110" width="220" height="96" rx="12" fill="#FFF"/>
    <text x="50" y="136">Agents running</text>
    <text x="50" y="174" font-size="30" font-weight="700" fill="#000">5 / 7</text>
    <text x="50" y="194" font-size="12">of the agents configured</text>

    <rect x="270" y="110" width="220" height="96" rx="12" fill="#FFF"/>
    <text x="290" y="136">Open work</text>
    <text x="290" y="174" font-size="30" font-weight="700" fill="#000">23</text>
    <text x="290" y="194" font-size="12">14 issues · 9 PRs · 4 held</text>

    <rect x="510" y="110" width="220" height="96" rx="12" fill="#FFF"/>
    <text x="530" y="136">Ready to merge</text>
    <text x="530" y="174" font-size="30" font-weight="700" fill="#000">6</text>
    <text x="530" y="194" font-size="12">11 actionable</text>

    <rect x="750" y="110" width="220" height="96" rx="12" fill="#FFF"/>
    <text x="770" y="136">Governor mode</text>
    <text x="770" y="174" font-size="30" font-weight="700" fill="#000">busy</text>
    <text x="770" y="194" font-size="12">how hard Hive works the queue</text>
  </g>

  <!-- Queue lines -->
  <rect x="30" y="226" width="600" height="230" rx="12" fill="#FFF"/>
  <text x="50" y="256" font-size="16" font-weight="700" fill="#000">Queue, last 17 hours</text>
  <g font-size="12" fill="#5E5C64">
    <rect x="50" y="268" width="10" height="10" fill="#205EA6"/><text x="65" y="277">issues</text>
    <rect x="115" y="268" width="10" height="10" fill="#66800B"/><text x="130" y="277">PRs</text>
    <rect x="170" y="268" width="10" height="10" fill="#AF3029"/><text x="185" y="277">held</text>
  </g>
  <line x1="60" y1="410" x2="600" y2="410" stroke="#DEDDDA"/>
  <g fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="60.0,338 91.8,332 123.5,326 155.3,326 187.1,320 218.8,314 250.6,320 282.4,326 314.1,326 345.9,332 377.6,338 409.4,338 441.2,332 472.9,326 504.7,326 536.5,320 568.2,326 600.0,326" stroke="#205EA6"/>
    <polyline points="60.0,368 91.8,362 123.5,362 155.3,356 187.1,356 218.8,362 250.6,362 282.4,368 314.1,368 345.9,374 377.6,374 409.4,368 441.2,362 472.9,356 504.7,356 536.5,356 568.2,356 600.0,356" stroke="#66800B"/>
    <polyline points="60.0,392 91.8,392 123.5,392 155.3,386 187.1,386 218.8,386 250.6,386 282.4,386 314.1,392 345.9,392 377.6,392 409.4,386 441.2,386 472.9,386 504.7,386 536.5,386 568.2,386 600.0,386" stroke="#AF3029"/>
  </g>
  <g font-size="12" fill="#5E5C64">
    <text x="60" y="430">17 h ago</text><text x="600" y="430" text-anchor="end">now</text>
    <text x="50" y="446" font-size="11" fill="#77767B">one point per governor evaluation (about every 5 minutes)</text>
  </g>

  <!-- Governor mode band -->
  <rect x="650" y="226" width="320" height="230" rx="12" fill="#FFF"/>
  <text x="670" y="256" font-size="16" font-weight="700" fill="#000">Governor mode</text>
  <g>
    <rect x="670" y="292" width="60" height="40" fill="#205EA6"/>
    <rect x="730" y="292" width="110" height="40" fill="#BC5215"/>
    <rect x="840" y="292" width="30" height="40" fill="#AF3029"/>
    <rect x="870" y="292" width="80" height="40" fill="#BC5215"/>
  </g>
  <g font-size="12" font-weight="600" fill="#FFF" text-anchor="middle">
    <text x="700" y="317">quiet</text><text x="785" y="317">busy</text><text x="910" y="317">busy</text>
  </g>
  <g font-size="12" fill="#5E5C64">
    <text x="670" y="352">17 h ago</text><text x="950" y="352" text-anchor="end">now</text>
    <rect x="670" y="372" width="10" height="10" fill="#9A9996"/><text x="685" y="381">idle</text>
    <rect x="725" y="372" width="10" height="10" fill="#205EA6"/><text x="740" y="381">quiet</text>
    <rect x="785" y="372" width="10" height="10" fill="#BC5215"/><text x="800" y="381">busy</text>
    <rect x="840" y="372" width="10" height="10" fill="#AF3029"/><text x="855" y="381">surge</text>
    <text x="670" y="418">Busy for the last 2 hours; 3 mode changes.</text>
    <text x="670" y="436" font-size="11" fill="#77767B">Rises with queue size: idle → quiet → busy → surge.</text>
  </g>

  <!-- Contributor agents -->
  <rect x="30" y="476" width="600" height="150" rx="12" fill="#FFF"/>
  <text x="50" y="504" font-size="16" font-weight="700" fill="#000">Contributor agents, last 7 days</text>
  <text x="610" y="504" font-size="12" fill="#5E5C64" text-anchor="end">181 tasks · 1 agent connected</text>
  <line x1="60" y1="600" x2="600" y2="600" stroke="#DEDDDA"/>
  <g fill="#0461BE"><rect x="63.2" y="582" width="2.6" height="18"/><rect x="66.4" y="564" width="2.6" height="36"/><rect x="69.6" y="564" width="2.6" height="36"/><rect x="82.5" y="564" width="2.6" height="36"/><rect x="85.7" y="546" width="2.6" height="54"/><rect x="88.9" y="582" width="2.6" height="18"/><rect x="92.1" y="582" width="2.6" height="18"/><rect x="95.4" y="546" width="2.6" height="54"/><rect x="98.6" y="564" width="2.6" height="36"/><rect x="101.8" y="582" width="2.6" height="18"/><rect x="105.0" y="582" width="2.6" height="18"/><rect x="111.4" y="582" width="2.6" height="18"/><rect x="114.6" y="564" width="2.6" height="36"/><rect x="117.9" y="564" width="2.6" height="36"/><rect x="124.3" y="582" width="2.6" height="18"/><rect x="133.9" y="582" width="2.6" height="18"/><rect x="143.6" y="582" width="2.6" height="18"/><rect x="146.8" y="582" width="2.6" height="18"/><rect x="153.2" y="582" width="2.6" height="18"/><rect x="159.6" y="564" width="2.6" height="36"/><rect x="162.9" y="582" width="2.6" height="18"/><rect x="166.1" y="546" width="2.6" height="54"/><rect x="169.3" y="582" width="2.6" height="18"/><rect x="172.5" y="546" width="2.6" height="54"/><rect x="175.7" y="582" width="2.6" height="18"/><rect x="182.1" y="582" width="2.6" height="18"/><rect x="188.6" y="546" width="2.6" height="54"/><rect x="191.8" y="564" width="2.6" height="36"/><rect x="195.0" y="546" width="2.6" height="54"/><rect x="198.2" y="546" width="2.6" height="54"/><rect x="201.4" y="546" width="2.6" height="54"/><rect x="204.6" y="582" width="2.6" height="18"/><rect x="207.9" y="546" width="2.6" height="54"/><rect x="211.1" y="582" width="2.6" height="18"/><rect x="214.3" y="582" width="2.6" height="18"/><rect x="220.7" y="582" width="2.6" height="18"/><rect x="227.1" y="582" width="2.6" height="18"/><rect x="240.0" y="564" width="2.6" height="36"/><rect x="246.4" y="582" width="2.6" height="18"/><rect x="249.6" y="564" width="2.6" height="36"/><rect x="252.9" y="546" width