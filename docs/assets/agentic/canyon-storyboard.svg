<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title>Agentic tab canyon storyboard: three keyframes of the scroll-driven scene</title>
  <desc>Golden hour with high water, sunset with half the strata revealed, and night with the water drained down to the Hive bedrock. Colours are Flexoki accents.</desc>
  <defs>
    <!-- Left canyon wall: stepped terraces, one ledge per stratum. The right wall is its mirror. -->
    <polygon id="wall-l" points="0,180 88,180 96,214 108,214 114,254 122,254 128,294 134,294 138,334 142,334 144,374 146,374 148,440 0,440"/>
    <clipPath id="walls-clip">
      <use href="#wall-l"/>
      <use href="#wall-l" transform="translate(300,0) scale(-1,1)"/>
    </clipPath>
    <clipPath id="frame-clip">
      <rect width="300" height="440" rx="14"/>
    </clipPath>
    <linearGradient id="sky-golden" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66A0C8"/>
      <stop offset="0.45" stop-color="#ABCFE2"/>
      <stop offset="1" stop-color="#F1D67E"/>
    </linearGradient>
    <linearGradient id="sky-sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E409D"/>
      <stop offset="0.5" stop-color="#CE5D97"/>
      <stop offset="1" stop-color="#EC8B49"/>
    </linearGradient>
    <linearGradient id="sky-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100F0F"/>
      <stop offset="0.6" stop-color="#12253B"/>
      <stop offset="1" stop-color="#133051"/>
    </linearGradient>
    <!-- Strata, rim to bedrock. The bedrock is honey-coloured: Hive. -->
    <g id="canyon">
      <g clip-path="url(#walls-clip)">
        <rect y="180" width="300" height="34" fill="#EC8B49"/>
        <rect y="214" width="300" height="40" fill="#CB6120"/>
        <rect y="254" width="300" height="40" fill="#D14D41"/>
        <rect y="294" width="300" height="40" fill="#AF3029"/>
        <rect y="334" width="300" height="40" fill="#87285E"/>
        <rect y="374" width="300" height="66" fill="#BE9207"/>
        <g fill="none" stroke="#FFFCF0" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
          <path d="M8,187 h40 M18,221 h34 M10,261 h28 M22,301 h40 M8,341 h30"/>
          <path d="M252,187 h40 M248,221 h34 M262,261 h28 M238,301 h40 M262,341 h30"/>
        </g>
        <g fill="none" stroke="#100F0F" stroke-opacity="0.35" stroke-width="1.5">
          <path d="M0,214 H300 M0,254 H300 M0,294 H300 M0,334 H300 M0,374 H300"/>
        </g>
        <g fill="none" stroke="#8E6B01" stroke-width="1.5">
          <path id="hex" d="M13,414 l3.5,-6 h7 l3.5,6 l-3.5,6 h-7 z"/>
          <use href="#hex" x="16"/><use href="#hex" x="32"/><use href="#hex" x="48"/><use href="#hex" x="64"/><use href="#hex" x="80"/>
          <use href="#hex" x="8" y="12"/><use href="#hex" x="24" y="12"/><use href="#hex" x="40" y="12"/><use href="#hex" x="56" y="12"/><use href="#hex" x="72" y="12"/>
          <use href="#hex" x="180"/><use href="#hex" x="196"/><use href="#hex" x="212"/><use href="#hex" x="228"/><use href="#hex" x="244"/><use href="#hex" x="260"/>
          <use href="#hex" x="188" y="12"/><use href="#hex" x="204" y="12"/><use href="#hex" x="220" y="12"/><use href="#hex" x="236" y="12"/><use href="#hex" x="252" y="12"/>
        </g>
      </g>
      <g fill="none" stroke="#100F0F" stroke-width="3" stroke-linejoin="round">
        <use href="#wall-l"/>
        <use href="#wall-l" transform="translate(300,0) scale(-1,1)"/>
      </g>
    </g>
    <!-- One tablet per stratum: the pillar that layer reveals. -->
    <g id="tablet-1"><rect x="6" y="188" width="78" height="18" rx="9" fill="#FFFCF0" stroke="#100F0F" stroke-width="1.5"/><text x="45" y="201" font-size="11" font-weight="600" text-anchor="middle" fill="#100F0F">Content</text></g>
    <g id="tablet-2"><rect x="6" y="225" width="78" height="18" rx="9" fill="#FFFCF0" stroke="#100F0F" stroke-width="1.5"/><text x="45" y="238" font-size="11" font-weight="600" text-anchor="middle" fill="#100F0F">Interface</text></g>
    <g id="tablet-3"><rect x="6" y="265" width="78" height="18" rx="9" fill="#FFFCF0" stroke="#100F0F" stroke-width="1.5"/><text x="45" y="278" font-size="11" font-weight="600" text-anchor="middle" fill="#100F0F">API</text></g>
    <g id="tablet-4"><rect x="6" y="305" width="78" height="18" rx="9" fill="#FFFCF0" stroke="#100F0F" stroke-width="1.5"/><text x="45" y="318" font-size="11" font-weight="600" text-anchor="middle" fill="#100F0F">Quality</text></g>
    <g id="tablet-5"><rect x="6" y="345" width="78" height="18" rx="9" fill="#FFFCF0" stroke="#100F0F" stroke-width="1.5"/><text x="45" y="358" font-size="11" font-weight="600" text-anchor="middle" fill="#100F0F">Delivery</text></g>
    <g id="tablet-6"><rect x="6" y="384" width="96" height="18" rx="9" fill="#FFFCF0" stroke="#100F0F" stroke-width="1.5"/><text x="54" y="397" font-size="11" font-weight="600" text-anchor="middle" fill="#100F0F">Agents · Hive</text></g>
  </defs>

  <rect width="960" height="545" fill="#F3EFE5"/>
  <text x="15" y="28" font-size="16" font-weight="700" fill="#100F0F">Agentic tab · canyon storyboard (concept, not to scale)</text>

  <!-- Frame 1: p = 0, golden hour, water at the rim -->
  <g transform="translate(15,44)">
    <g clip-path="url(#frame-clip)">
      <rect width="300" height="440" fill="url(#sky-golden)"/>
      <g fill="#FFFCF0" opacity="0.9"><circle cx="50" cy="74" r="12"/><circle cx="66" cy="65" r="16"/><circle cx="83" cy="74" r="12"/><rect x="50" y="72" width="33" height="14"/></g>
      <g fill="#FFFCF0" opacity="0.75"><circle cx="226" cy="44" r="9"/><circle cx="238" cy="38" r="12"/><circle cx="251" cy="44" r="9"/><rect x="226" y="42" width="25" height="11"/></g>
      <circle cx="150" cy="150" r="70" fill="#F6E2A0" opacity="0.55"/>
      <g stroke="#100F0F" stroke-width="3" stroke-linecap="round">
        <path d="M200,150 h12 M100,150 h-12 M150,100 v-12 M114.6,114.6 l-8.4,-8.4 M185.4,114.6 l8.4,-8.4"/>
      </g>
      <circle cx="150" cy="150" r="40" fill="#ECCB60" stroke="#100F0F" stroke-width="3"/>
      <use href="#canyon"/>
      <use href="#tablet-1"/>
      <path d="M0,222 q18.75,-6 37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 L300,440 L0,440 Z" fill="#4385BE" fill-opacity="0.92" stroke="#100F0F" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M20,236 h30 M120,248 h24 M210,240 h36" stroke="#C6DDE8" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect width="300" height="440" rx="14" fill="none" stroke="#100F0F" stroke-width="2"/>
  </g>

  <!-- Frame 2: p ≈ 0.5, sunset, three strata revealed -->
  <g transform="translate(330,44)">
    <g clip-path="url(#frame-clip)">
      <rect width="300" height="440" fill="url(#sky-sunset)"/>
      <g fill="#FFFCF0" opacity="0.6"><circle cx="40" cy="30" r="1.4"/><circle cx="120" cy="18" r="1.2"/><circle cx="262" cy="34" r="1.5"/></g>
      <g fill="#F4A4C2" opacity="0.9"><circle cx="58" cy="96" r="12"/><circle cx="74" cy="87" r="16"/><circle cx="91" cy="96" r="12"/><rect x="58" y="94" width="33" height="14"/></g>
      <circle cx="150" cy="205" r="82" fill="#F9AE77" opacity="0.5"/>
      <circle cx="150" cy="205" r="48" fill="#EC8B49" stroke="#100F0F" stroke-width="3"/>
      <use href="#canyon"/>
      <rect width="300" height="440" fill="#261C39" opacity="0.22" clip-path="url(#walls-clip)"/>
      <use href="#tablet-1"/><use href="#tablet-2"/><use href="#tablet-3"/>
      <path d="M0,302 q18.75,-6 37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 L300,440 L0,440 Z" fill="#3171B2" fill-opacity="0.92" stroke="#100F0F" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M30,318 h28 M140,328 h20 M220,320 h34" stroke="#F9AE77" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect width="300" height="440" rx="14" fill="none" stroke="#100F0F" stroke-width="2"/>
  </g>

  <!-- Frame 3: p = 1, night, drained to the Hive bedrock -->
  <g transform="translate(645,44)">
    <g clip-path="url(#frame-clip)">
      <rect width="300" height="440" fill="url(#sky-night)"/>
      <g fill="#FFFCF0">
        <circle cx="30" cy="40" r="1.6"/><circle cx="70" cy="90" r="1.2"/><circle cx="110" cy="30" r="1.8"/><circle cx="180" cy="70" r="1.3"/>
        <circle cx="270" cy="120" r="1.5"/><circle cx="205" cy="140" r="1.1"/><circle cx="50" cy="140" r="1.2"/><circle cx="140" cy="105" r="1.4"/>
        <circle cx="160" cy="22" r="1.2"/><circle cx="88" cy="160" r="1"/><circle cx="20" cy="110" r="1.3"/>
      </g>
      <circle cx="230" cy="60" r="18" fill="#FFFCF0"/>
      <circle cx="239" cy="53" r="16" fill="#111A27"/>
      <use href="#canyon"/>
      <rect width="300" height="440" fill="#101A24" opacity="0.5" clip-path="url(#walls-clip)"/>
      <use href="#tablet-1"/><use href="#tablet-2"/><use href="#tablet-3"/><use href="#tablet-4"/><use href="#tablet-5"/><use href="#tablet-6"/>
      <path d="M0,428 q18.75,-5 37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 t37.5,0 L300,440 L0,440 Z" fill="#163B66" fill-opacity="0.95" stroke="#100F0F" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <rect width="300" height="440" rx="14" fill="none" stroke="#100F0F" stroke-width="2"/>
  </g>

  <g font-size="13" fill="#100F0F">
    <text x="15" y="506" font-weight="700">p = 0 · golden hour</text>
    <text x="15" y="524">Water at the rim; only the Content layer shows.</text>
    <text x="330" y="506" font-weight="700">p ≈ 0.5 · sunset</text>
    <text x="330" y="524">Sun sinks into the gorge; three layers revealed.</text>
    <text x="645" y="506" font-weight="700">p = 1 · night</text>
    <text x="645" y="524">Drained to the honey bedrock: Agents · Hive.</text>
  </g>
</svg>
