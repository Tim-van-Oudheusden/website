apiVersion: v1
kind: Pod
metadata:
  name: website
  # kube play does not relabel hostPath bind mounts, so on SELinux hosts the
  # containers cannot read the user_home_t checkout (#500). Ignored elsewhere.
  annotations:
    io.podman.annotations.label/front-end: disable
    io.podman.annotations.label/back-end: disable
  labels:
    app: website

# Host ports are published on loopback only, as in prod.yaml: without hostIP,
# podman binds them on every interface and the dev servers are reachable from
# the LAN. The containers still listen on all interfaces inside the pod.
spec:
  containers:
    - name: front-end
      image: localhost/website/front-end:dev
      env:
        - name: NODE_ENV
          value: development
      ports:
        - containerPort: 5173
          hostPort: 5173
          hostIP: 127.0.0.1
      volumeMounts:
        - name: front-end-src
          mountPath: /app/front-end
        - name: shared-src
          mountPath: /app/shared
        - name: public
          mountPath: /app/public
          readOnly: true
        - name: root-package-json
          mountPath: /app/package.json
          readOnly: true
        - name: bun-lock
          mountPath: /app/bun.lock

    - name: back-end
      image: localhost/website/back-end:dev
      env:
        - name: NODE_ENV
          value: development
        - name: HOST
          value: "0.0.0.0"
      ports:
        - containerPort: 3001
          hostPort: 3001
          hostIP: 127.0.0.1
      # Same probe as prod.yaml (#707).
      livenessProbe:
        httpGet:
          path: /health
          port: 3001
        initialDelaySeconds: 5
        periodSeconds: 15
        failureThreshold: 3
      volumeMounts:
        - name: back-end-src
          mountPath: /app/back-end
        - name: shared-src
          mountPath: /app/shared
        - name: content
          mountPath: /app/content
          readOnly: true
        - name: root-package-json
          mountPath: /app/package.json
          readOnly: true
        - name: bun-lock
          mountPath: /app/bun.lock

  volumes:
    - name: front-end-src
      hostPath:
        path: ./front-end
        type: Directory
    - name: back-end-src
      hostPath:
        path: ./back-end
        type: Directory
    - name: shared-src
      hostPath:
        path: ./shared
        type: Directory
    - name: content
      hostPath:
        path: ./content
        type: Directory
    - name: public
      hostPath:
        path: ./public
        type: Directory
    - name: root-package-json
      hostPath:
        path: ./package.json
        type: File
    - name: bun-lock
      hostPath:
        path: ./bun.lock
        type: File