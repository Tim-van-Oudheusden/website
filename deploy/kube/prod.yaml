apiVersion: v1
kind: Pod
metadata:
  name: website
  labels:
    app: website

# Host ports are published on loopback only: cloudflared (Network=host) is the
# sole way in, so the origin is never reachable from the LAN bypassing
# Cloudflare. 8300/8301 avoid other services on the host's 3000/3001; the
# containers still listen on 3000/3001 inside the pod.
# deploy/cloudflared/config.yml must target exactly these host ports.
spec:
  restartPolicy: Always
  containers:
    - name: front-end
      image: ghcr.io/tim-van-oudheusden/website/front-end:latest
      # Play the local :latest, which website-update.sh pulls and, on a failed
      # update, re-tags back to the previous image. With no policy, kube play
      # pulls a :latest whose registry digest differs from the local one, so
      # the rollback replay would start the rejected image again (#948). A
      # host with no local image still pulls it on first play.
      imagePullPolicy: IfNotPresent
      env:
        - name: NODE_ENV
          value: production
      ports:
        - containerPort: 3000
          hostPort: 8300
          hostIP: 127.0.0.1
      # /health returns 503 when dist/index.html is unreadable (every real
      # page response needs that file too). Same exec-probe shape as the
      # back-end (#707/#714): kube play turns an httpGet probe into `curl -f`,
      # and the oven/bun image has no curl, so it would restart a healthy
      # container forever.
      livenessProbe:
        exec:
          command:
            - bun
            - -e
            - "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        initialDelaySeconds: 5
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3

    - name: back-end
      image: ghcr.io/tim-van-oudheusden/website/back-end:latest
      # Same as the front-end: keep the image website-update.sh left on :latest.
      imagePullPolicy: IfNotPresent
      env:
        - name: NODE_ENV
          value: production
        - name: HOST
          value: "0.0.0.0"
        # Per-article view counts (SQLite); lives on the host so it survives
        # pod replays and image updates.
        - name: VIEWS_DB_PATH
          value: /data/views.sqlite
      ports:
        - containerPort: 3001
          hostPort: 8301
          hostIP: 127.0.0.1
      # /health returns 503 when the content dir is unreadable; podman kube
      # play turns this into a healthcheck that restarts the container (#707).
      # exec, not httpGet: kube play runs httpGet probes as `curl -f`, and the
      # oven/bun image has no curl, so the probe would fail on a healthy server
      # and restart it forever. Same check as the Dockerfile HEALTHCHECK.
      # No readinessProbe: podman has no endpoint layer to gate traffic on it.
      livenessProbe:
        exec:
          command:
            - bun
            - -e
            - "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        initialDelaySeconds: 5
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      volumeMounts:
        - name: views-data
          mountPath: /data

  volumes:
    - name: views-data
      hostPath:
        path: website-data
        type: DirectoryOrCreate