name: AI audit trail

# Audit trail of agent work (#975): every PR merged into main in the reporting
# window, attributed to its source (a Hive agent and model from the PR's
# signature, Claude Code in CI, Dependabot, or other), with who opened it and
# who merged it. Computed by scripts/ai-audit-report.ts. The weekly run covers
# the past 7 days, so consecutive runs form an unbroken trail. Results land in
# the run's job summary and, with the raw PR data, in the ai-audit artifact.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Reporting window in days
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  audit:
    name: AI audit trail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Generate audit trail
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          set -euo pipefail
          since="$(date -u -d "${DAYS} days ago" +%Y-%m-%d)"
          gh pr list --repo "$REPO" --state merged --limit 1000 \
            --search "merged:>=${since}" \
            --json number,title,author,headRefName,mergedAt,mergedBy,body > ai-audit-prs.json
          bun scripts/ai-audit-report.ts "$since" ai-audit-prs.json > ai-audit.md
      - name: Publish job summary
        run: cat ai-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit trail
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-audit
          path: |
            ai-audit.md
            ai-audit-prs.json
          retention-days: 90
