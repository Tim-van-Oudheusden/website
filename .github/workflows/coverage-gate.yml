name: Coverage gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    name: Unit-test coverage floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Back-end coverage
        run: scripts/coverage-check.sh back-end 95 90
      - name: Shared coverage
        run: scripts/coverage-check.sh shared 90 90
      - name: Front-end coverage
        run: scripts/coverage-check.sh front-end 55 60