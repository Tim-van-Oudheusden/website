name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

  build-images:
    name: Build production images (podman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build front-end image
        run: podman build -f front-end/Dockerfile --target prod -t website/front-end:ci .
      - name: Build back-end image
        run: podman build -f back-end/Dockerfile --target prod -t website/back-end:ci .

  e2e:
    name: E2E (podman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Podman
        run: |
          sudo apt-get install -y podman podman-compose
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Start stack
        run: podman compose up -d
      - name: Wait for services
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health >/dev/null && curl -fsS http://localhost:5173/ >/dev/null; then
              echo "services ready"
              exit 0
            fi
            sleep 5
          done
          podman compose ps
          podman compose logs --tail 100
          exit 1
      - name: Run e2e tests
        run: bun run test:e2e
      - name: Stop stack
        if: always()
        run: podman compose down
