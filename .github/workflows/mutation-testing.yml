name: Mutation testing

# Report-only. Finds branches the unit tests run but never assert, which line
# coverage cannot show (#939). StrykerJS mutates one workspace's source (or the
# TypeScript tools in scripts/, #945) per job and runs the tests that cover it
# against each mutant (stryker/<workspace>.conf.mjs); a mutant they still pass
# on survived. The score goes to the job summary and the
# HTML and JSON reports to the mutation-<workspace> artifact. No job fails on the
# score; once there is a baseline it can get a floor, like the coverage floors.

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    # Every mutant runs its workspace's whole suite (Stryker has no Bun runner, so
    # no per-test coverage). The front-end and back-end each took longer than the
    # timeout alone, so each is split in two configs, one job each
    # (docs/testing.md).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        workspace: [back-end, back-end-content, front-end, front-end-features, shared, scripts]
    env:
      WORKSPACE: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Stryker
        run: bun x stryker run "stryker/$WORKSPACE.conf.mjs"
      - name: Publish job summary
        if: always()
        run: bun scripts/mutation-summary.ts "reports/mutation/$WORKSPACE.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.workspace }}
          path: reports/mutation/
