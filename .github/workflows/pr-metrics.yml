name: PR metrics

# PR acceptance metric: of the pull requests closed in the reporting window,
# how many were merged vs. closed without merging. Split by source (a Hive
# agent, Claude Code in CI, Dependabot, or other) with the same rule as the AI
# audit trail (scripts/pr-source.ts), so agent work has its own feedback loop.
# Computed by scripts/pr-metrics.ts. Results land in the run's job summary.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Reporting window in days
        required: false
        default: '28'

permissions:
  contents: read

jobs:
  acceptance:
    name: PR acceptance rate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Compute acceptance metric
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '28' }}
        run: |
          set -euo pipefail
          since="$(date -u -d "${DAYS} days ago" +%Y-%m-%d)"
          gh pr list --repo "$REPO" --state closed --limit 1000 \
            --search "closed:>=${since}" \
            --json headRefName,mergedAt,body > prs.json
          bun scripts/pr-metrics.ts "$since" prs.json >> "$GITHUB_STEP_SUMMARY"
