name: Strategy report

# Strategic dashboard (#968): where the project is heading rather than how one
# change fared. Issue and PR flow over the reporting window, the open backlog
# per pipeline stage, and ACMM maturity gaps per level, computed by
# scripts/strategy-report.ts. Results land in the run's job summary.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Reporting window in days
        required: false
        default: '28'

permissions:
  contents: read

jobs:
  report:
    name: Strategy report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Generate strategy report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '28' }}
        run: |
          set -euo pipefail
          since="$(date -u -d "${DAYS} days ago" +%Y-%m-%d)"
          gh issue list --repo "$REPO" --state all --limit 10000 \
            --json number,title,state,labels,createdAt,closedAt > issues.json
          gh pr list --repo "$REPO" --state merged --limit 1000 \
            --search "merged:>=${since}" --json mergedAt > prs.json
          bun scripts/strategy-report.ts "$since" issues.json prs.json >> "$GITHUB_STEP_SUMMARY"
