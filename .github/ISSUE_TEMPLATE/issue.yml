name: Issue
description: Report a bug, request a feature, or file a task
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Please keep the title in
        [Conventional Commits](https://www.conventionalcommits.org/) style,
        e.g. `fix(backend): ...`, `feat(frontend): ...`, `chore: ...`, and
        apply the matching type/scope labels after filing.
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What kind of issue is this?
      multiple: false
      options:
        - Bug (type::bug)
        - Feature (type::feature)
        - Task (type::task)
        - Chore (type::chore)
        - Refactor (refactor)
        - Audit (audit)
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which part of the repository is affected?
      multiple: false
      options:
        - Frontend (frontend)
        - Back-end (backend)
        - Shared (shared)
        - Content (content)
        - Tooling / CI (tooling)
        - Other (no label)
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      multiple: false
      options:
        - Critical (priority::critical)
        - High (priority::high)
        - Medium (priority::medium)
        - Low (priority::low)
      default: 2
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem, or what should be done?
      placeholder: |
        - What's wrong or what's needed
        - Why it matters
        - Any relevant context or links
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this issue is done?
      placeholder: |
        - [ ] Behaviour or deliverable that proves completion
        - [ ] Verification steps, if applicable
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Followed the workflow in AGENTS.md (issues via GitHub API, beads sync, Conventional Commits)
          required: false