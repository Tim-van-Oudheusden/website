# Risk assessment for pull requests: the risk tier of each changed path.
# Evaluated by scripts/tier-classify.sh; the classifier rates every PR
# (tier-classifier.yml) and the merge queue leaves high-risk PRs for the
# maintainer to review and merge. What each tier asks of reviewers is in
# docs/risk-tiers.md.
#
# `rules` is an ordered list of `<tier> <glob>` items, where tier is low,
# medium or high. A changed path takes the tier of the FIRST rule whose glob
# matches it, so high-risk rules come before the broad low-risk ones
# (AGENTS.md is high even though *.md is low). `*` matches across `/`. A path
# matching no rule is medium.
#
# The classifier reads a strict line subset of YAML: the `rules:` line, one
# `- <tier> <glob>` item per line, blank lines and whole-line `#` comments.

rules:
  # CI gates, review rubric, release job, and this file itself.
  - high    .github/*

  # Runtime, image and build configuration.
  - high    deploy/*
  - high    Dockerfile*
  - high    */Dockerfile
  - high    .devcontainer/*
  - high    .dockerignore
  - high    */vite.config.*

  # Gate and release tooling.
  - high    scripts/*

  # Gate configuration: what lint, duplication, typecheck and the test runners
  # enforce in CI. These gates pass a change that loosens their own config.
  - high    eslint.config.*
  - high    */eslint.config.*
  - high    .jscpd.json
  - high    tsconfig*.json
  - high    */tsconfig*.json
  - high    bunfig.toml
  - high    */bunfig.toml
  - high    playwright.config.ts

  # The tests that pin the workflows, CODEOWNERS, these rules and the merge queue.
  - high    test/shared/src/codeowners.test.ts
  - high    test/shared/src/merge-queue-script.test.ts
  - high    test/shared/src/tier-classifier-script.test.ts
  - high    test/shared/src/workflow-*.test.ts
  - high    test/shared/src/*-workflow.test.ts

  # Dependencies (supply chain).
  - high    package.json
  - high    */package.json
  - high    bun.lock

  # Agent instructions and governance.
  - high    AGENTS.md
  - high    CLAUDE.md
  - high    .claude/*
  - high    .cursor/*
  - high    prompts/*

  # Prose and static assets that do not execute.
  - low     content/*
  - low     docs/*
  - low     research/*
  - low     public/*
  - low     *.md
